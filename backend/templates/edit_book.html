<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2>✏️ Edit Book</h2>

    <form action="/admin/update-book" method="post">

        <input type="hidden" name="isbn" value="{{ book.isbn }}">

        <div class="mb-3">
            <label>Title</label>
            <input
                type="text"
                name="title"
                class="form-control"
                value="{{ book.title }}">
        </div>

        <div class="mb-3">
            <label>Author</label>
            <input
                type="text"
                name="author"
                class="form-control"
                value="{{ book.author }}">
        </div>

        <div class="mb-3">
            <label>Buy Price</label>
            <input
                type="number"
                name="price"
                class="form-control"
                value="{{ book.price }}">
        </div>

        <div class="mb-3">
            <label>Rent Price</label>
            <input
                type="number"
                name="rent_price"
                class="form-control"
                value="{{ book.rent_price }}">
        </div>

        <div class="mb-3">
            <label>Stock</label>
            <input
                type="number"
                name="stock"
                class="form-control"
                value="{{ book.stock }}">
        </div>
<div class="mb-3">
    <label class="form-label">
        Rent Days
    </label>

    <input
        type="number"
        class="form-control"
        name="rent_days"
        value="{{ book.rent_days }}"
        required>
</div>

        <button class="btn btn-success">
            💾 Update Book
        </button>

        <a href="/admin/books" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
