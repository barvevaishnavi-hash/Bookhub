<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookHub Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2b4dbb,#4f46e5);
}

.register-box{
width:450px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
text-align:center;
}

.logo{
font-size:45px;
margin-bottom:10px;
}

h1{
color:#243b8f;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

input:focus{
outline:none;
border-color:#2b4dbb;
}

button{
width:100%;
padding:15px;
background:#ff9800;
border:none;
border-radius:10px;
font-size:18px;
color:white;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#e68900;
}

.bottom{
margin-top:20px;
}

.bottom a{
text-decoration:none;
color:#2b4dbb;
font-weight:bold;
}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">📚</div>

<h1>Create Account</h1>

<p>Join BookHub Today</p>

<form action="/register" method="post">

    <input type="text"
           name="full_name"
           placeholder="Full Name"
           required>

    <input type="email"
           name="email"
           placeholder="Email Address"
           required>

    <input type="tel"
           name="phone"
           placeholder="Phone Number"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">Create Account</button>

</form>

<div class="bottom">

Already have an account?

<a href="/">Login</a>

</div>

</div>

</body>
</html>
