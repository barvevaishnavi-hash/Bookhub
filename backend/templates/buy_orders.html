<!DOCTYPE html>
<html>

<head>

    <title>Buy Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">📦 Buy Orders</h2>

    <a href="/admin/dashboard" class="btn btn-secondary mb-3">
        ← Back to Dashboard
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Book</th>
                <th>Customer</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Amount</th>
                <th>Status</th>

            </tr>

        </thead>

        <tbody>

        {% for order in orders %}

            <tr>

                <td>{{ order.id }}</td>

                <td>{{ order.title }}</td>

                <td>{{ order.customer_name }}</td>

                <td>{{ order.customer_email }}</td>

                <td>{{ order.phone }}</td>

                <td>₹ {{ order.amount }}</td>

                <td>{{ order.status }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
